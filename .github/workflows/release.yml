# The release: Fabric Dashboards.app, universal, signed with the organization's CI Developer ID
# and the hardened runtime, notarized and stapled; the drag-to-install image and the update zip
# the app's own updater installs, both made from the stapled app; update-feed.json and the
# build receipt. Beside it the Windows and Linux packages (packages.yml, FD-37; unsigned until
# PL-03's certificate profile exists). Then attested (Sigstore), summed and GPG-signed, and published.
#
# Signing happens only here, in the protected `release` environment: approved by a
# person from release-approvers, who may be whoever pushed the tag; an agent never
# approves (passioncode-ai/.github release-signing/README.md). A build signed anywhere else is a debug build and is never
# published. A published release is never rewritten: a fix is a new tag. docs/RUNBOOK.md#release
#
# Release:    push an annotated vX.Y.Z tag on the reviewed release commit.
# Rehearsal:  push vX.Y.Z-rc.N (the push trigger ignores it), then
#             gh workflow run release.yml --ref vX.Y.Z-rc.N -f publish=false
#             The signed set is kept as a workflow artifact; no release is created.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish:
        description: "false = rehearsal: build, sign, notarize and attest, create no release"
        type: boolean
        default: false

permissions:
  contents: read

# F-1: one release at a time across tags — an older run can never publish beside a newer one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag names package.json's version, and the CHANGELOG has its section
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$REF_TYPE" == tag ]] || { echo "::error::a release runs from a tag (vX.Y.Z, or vX.Y.Z-rc.N to rehearse), not from the $REF_TYPE $TAG"; exit 1; }
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          tagged=${BASH_REMATCH[1]}
          version=$(node -p "require('./package.json').version")
          [[ "$tagged" == "$version" ]] || { echo "::error::$TAG does not match package.json's version $version"; exit 1; }
          grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section '## $version'"; exit 1; }
          echo "$TAG builds Fabric Dashboards $version"
      # Squirrel installs whatever the latest release's feed names, older or not (ADR-0015): a full
      # release must be newer than the one published, or every installed copy would go back.
      - name: A full release is newer than the latest published one
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # F-2: a 404 means nothing is published yet; any other failure stops the release with gh's own words.
          if ! latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/tmp/gh-err); then
            grep -q 'HTTP 404' /tmp/gh-err && { echo "no published release yet"; exit 0; }
            echo "::error::could not read the latest release: $(head -c 300 /tmp/gh-err)"; exit 1
          fi
          [[ -z "$latest" ]] && { echo "no published release yet"; exit 0; }
          [[ "$latest" == "$TAG" ]] && { echo "::error::$TAG is already the latest published release"; exit 1; }
          newest=$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -1)
          [[ "$newest" == "${TAG#v}" ]] || { echo "::error::$TAG is older than the published $latest; installed copies would update backwards"; exit 1; }
          echo "$TAG is newer than the published $latest"

  check:
    uses: ./.github/workflows/validate.yml
    with:
      os: all # the release ships for every system, so the gate runs on each one's native runner (PL-08)

  # FD-37: Windows (NSIS x64, arm64) and Linux (AppImage + .deb x64, arm64), each on its native runner.
  packages:
    needs: [version, check]
    uses: ./.github/workflows/packages.yml

  # #region release-in-ci — docs: docs/RUNBOOK.md#release
  macos:
    needs: [version, check]
    runs-on: macos-latest
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (uvx runs dmgbuild for the image's window layout)
        with:
          enable-cache: false
      - run: npm ci
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dmg=release/Fabric-Dashboards-${version}.dmg" >> "$GITHUB_OUTPUT"
      - id: sign
        uses: passioncode-ai/.github/actions/apple-signing@v1
        with:
          developer-id-p12-b64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          team-id: ${{ vars.APPLE_TEAM_ID }}
      - name: Build the app, signed with the CI Developer ID
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: node scripts/dist-mac.mjs --stage app --identity "$IDENTITY"
      - name: Notarize, staple and assess the app
        uses: passioncode-ai/.github/actions/notarize@v1
        with:
          path: release/stage/Fabric Dashboards.app
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-p8-b64: ${{ secrets.ASC_API_KEY_P8_B64 }}
      - name: The update zip and the signed image, from the stapled app
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: node scripts/dist-mac.mjs --stage package --identity "$IDENTITY"
      - name: Notarize, staple and assess the image
        uses: passioncode-ai/.github/actions/notarize@v1
        with:
          path: ${{ steps.version.outputs.dmg }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-p8-b64: ${{ secrets.ASC_API_KEY_P8_B64 }}
      - name: Measure what ships, then write the update feed and the receipt
        run: node scripts/dist-mac.mjs --stage seal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            release/Fabric-Dashboards-${{ steps.version.outputs.version }}.dmg
            release/Fabric-Dashboards-${{ steps.version.outputs.version }}-mac.zip
            release/update-feed.json
            release/Fabric-Dashboards-${{ steps.version.outputs.version }}.receipt.json
          if-no-files-found: error
          # A rehearsal's signed set is kept 14 days (docs/RUNBOOK.md#release); publish reads it within hours.
          retention-days: 14
      - if: always()
        uses: passioncode-ai/.github/actions/apple-signing/cleanup@v1
  # #endregion release-in-ci

  # F-1: the same check again right before publishing — hours may pass between the first one and
  # the approvals, and a newer release may have been published meanwhile. A rehearsal is exempt.
  still-newest:
    needs: [macos, packages]
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Still newer than the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/tmp/gh-err); then
            grep -q 'HTTP 404' /tmp/gh-err && { echo "no published release yet"; exit 0; }
            echo "::error::could not read the latest release: $(head -c 300 /tmp/gh-err)"; exit 1
          fi
          [[ -z "$latest" ]] && exit 0
          [[ "$latest" == "$TAG" ]] && { echo "::error::$TAG is already published"; exit 1; }
          newest=$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -1)
          [[ "$newest" == "${TAG#v}" ]] || { echo "::error::$TAG is older than the published $latest; it must not be published"; exit 1; }

  publish:
    needs: [macos, packages, still-newest]
    # !cancelled(), not always(): a run cancelled between still-newest and publish never starts publishing (T-29).
    # Every system's packages or none: a release missing one would leave its copies behind.
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.packages.result == 'success' && (needs.still-newest.result == 'success' || needs.still-newest.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: passioncode-ai/.github/.github/workflows/release-publish.yml@v1
    with:
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets: inherit
