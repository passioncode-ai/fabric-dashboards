# The Windows and Linux packages (FD-37, ADR-0019, fabric-workspace knowledge/platforms.md PL-02, PL-03, PL-08):
# an NSIS per-user installer for Windows x64 and arm64, an AppImage and a .deb for Linux x64 and arm64, each
# built by scripts/dist-other.mjs on the native runner of its system and architecture, checked by the
# finished binary itself, with a receipt naming every file's SHA-256.
#
# Windows signing (PL-03): release.yml calls this with `sign: true`. Its Windows jobs then run in the
# protected `release` environment (approved by release-approvers; an agent never approves) and, where that
# environment's AZURE_SIGNING_ENABLED is true, sign with Azure Artifact Signing over OIDC — no secret: the
# environment's federated credential; passioncode-ai/.github actions/windows-signing@v1 — between dist-other's stages: the app's executable after `app`, the
# installer after `installer`; `seal` refuses a file that is not `Valid` and writes `windows_authenticode:
# SIGNED`. Otherwise the receipt says NOT_SIGNED. Linux packages are not Authenticode material. Every file is
# covered by the release's GPG-signed SHA256SUMS and Sigstore attestations (release-publish.yml, `release-*`).
#
# Dispatched by hand, or by validate.yml's `packages` flag, it is an unsigned rehearsal: the packages are
# kept as workflow artifacts for 14 days and no release is touched (machine CI policy of 2026-09-25: no push trigger).
name: packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sign:
        description: 'true from release.yml: Windows jobs run in the release environment and sign when AZURE_SIGNING_ENABLED is on'
        type: boolean
        default: false
      os:
        description: 'windows, linux, or all'
        type: string
        default: all

permissions:
  contents: read

jobs:
  # #region packages-in-ci — docs: docs/RUNBOOK.md#release
  package:
    strategy:
      fail-fast: false
      matrix:
        # Every row, filtered by `os` (release.yml runs its windows and linux stages as separate jobs, PL-10).
        include: ${{ fromJSON(inputs.os == 'windows' && '[{"runner":"windows-latest","os":"windows","arch":"x64"},{"runner":"windows-11-arm","os":"windows","arch":"arm64"}]' || inputs.os == 'linux' && '[{"runner":"ubuntu-24.04","os":"linux","arch":"x64"},{"runner":"ubuntu-24.04-arm","os":"linux","arch":"arm64"}]' || '[{"runner":"windows-latest","os":"windows","arch":"x64"},{"runner":"windows-11-arm","os":"windows","arch":"arm64"},{"runner":"ubuntu-24.04","os":"linux","arch":"x64"},{"runner":"ubuntu-24.04-arm","os":"linux","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    # Only a signing Windows job enters the protected environment; an empty name is no environment.
    environment: ${{ inputs.sign && matrix.os == 'windows' && 'release' || '' }}
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write # windows-signing@v1 (OIDC), used only when Windows signing is on
    env:
      FD_WINDOWS_SIGNING: ${{ inputs.sign && matrix.os == 'windows' && vars.AZURE_SIGNING_ENABLED == 'true' }}
      # A release (not a rehearsal): an unsigned Windows build must say so in the CHANGELOG (PL-03).
      FD_WINDOWS_RELEASE: ${{ inputs.sign && matrix.os == 'windows' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # electron-builder's bundled fpm (which makes the .deb) is an x86-64 binary; on arm64 it uses the
      # system's, installed from RubyGems at a fixed version.
      - name: fpm for the arm64 .deb
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ruby ruby-dev build-essential
          sudo gem install fpm -v 1.16.0 --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      # npm ci builds node-pty on Linux with node-gyp (python3, make, g++ are on the runner); Windows uses its prebuild.
      - run: npm ci
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build and check the app
        run: node scripts/dist-other.mjs --stage app
      # Signing pass 1: the app's executable, before the installer packs it — the organization's action
      # (passioncode-ai/.github, PL-03): OIDC sign-in, SHA-256 + RFC 3161 timestamp, fails unless Valid and timestamped.
      - name: Sign the app's executable
        if: env.FD_WINDOWS_SIGNING == 'true'
        uses: passioncode-ai/.github/actions/windows-signing@v1
        with:
          files: ${{ github.workspace }}\release\stage-windows-${{ matrix.arch }}\app\Fabric Dashboards.exe
          report: ${{ runner.temp }}/signatures-app.json
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
      - name: The installers
        run: node scripts/dist-other.mjs --stage installer
      # Signing pass 2: the installer itself.
      - name: Sign the installer
        if: env.FD_WINDOWS_SIGNING == 'true'
        uses: passioncode-ai/.github/actions/windows-signing@v1
        with:
          files: ${{ github.workspace }}\release\Fabric-Dashboards-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          report: ${{ runner.temp }}/signatures-installer.json
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
      - name: Check the signatures and write the receipt
        shell: bash
        env:
          # The two signing passes' reports; seal embeds the ones that exist.
          FD_SIGNATURE_REPORTS: ${{ runner.temp }}/signatures-app.json${{ runner.os == 'Windows' && ';' || ':' }}${{ runner.temp }}/signatures-installer.json
        run: node scripts/dist-other.mjs --stage seal
      # The .deb on a clean system: it installs with its own dependencies and its MCP server answers.
      - name: The .deb installs on a clean Ubuntu 24.04, its MCP server answers and the app starts
        if: matrix.os == 'linux'
        shell: bash
        run: |
          deb=$(ls release/Fabric-Dashboards-*-linux-${{ matrix.arch }}.deb)
          # The app starts its Chromium sandbox as a desktop would: the setuid helper needs these inside a container.
          docker run --rm --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v "$PWD:/w:ro" ubuntu:24.04 bash /w/scripts/deb-smoke.sh "/w/$deb"
      # The installer on the runner that built it: per-user install, MCP answers, the app's own /S uninstall removes it.
      - name: The installer installs per user, its MCP server answers, and /S uninstalls it
        if: matrix.os == 'windows'
        shell: bash
        run: node scripts/nsis-smoke.mjs release/Fabric-Dashboards-*-windows-${{ matrix.arch }}-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/Fabric-Dashboards-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}*
            !release/*.blockmap
          if-no-files-found: error
          retention-days: 14
  # #endregion packages-in-ci
