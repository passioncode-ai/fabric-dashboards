name: validate

# Hosted checks run nightly (23:00 Europe/Warsaw) and on demand — machine CI policy
# of 2026-09-25: no full suite on every push.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      FD_SKIP_LAUNCHD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
