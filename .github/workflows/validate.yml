name: validate

# Hosted checks run nightly (23:00 Europe/Warsaw) and on demand — machine CI policy
# of 2026-09-25: no full suite on every push. release.yml calls it before a release is signed.
# FD-37 / platforms.md PL-08: the nightly and a dispatch run the gate on every native runner the
# product ships for, and so does release.yml before a release (it passes `os: all`).
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      os:
        description: 'macos, or all (macOS, Windows x64/arm64, Linux x64/arm64)'
        default: all
      packages:
        description: 'then build the Windows and Linux packages (packages.yml) — a rehearsal from any branch'
        type: boolean
        default: false
      e2e:
        description: 'also drive the real app on Windows and Linux (SCN-052, test/e2e/desktop-other.test.ts)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      os:
        type: string
        default: macos

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.os == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest","windows-11-arm","ubuntu-24.04","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    # A hang is a failure with a name (each unit test also has its own 2-minute limit), never hours of a runner.
    timeout-minutes: 40
    env:
      FD_SKIP_LAUNCHD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # The gate's UX lint and the sample service are Python; setup-python provides `python3` on Windows.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
      - run: npm ci
      # FD-94: Windows PowerShell 5.1's first start on a fresh windows-11-arm runner took about a minute (2026-10-22 and
      # 23: the two tests that read a real token ACL ran 42 to 70 s, then passed the product's 60 s ACL timeout). Start
      # it once here, as the app's own ACL read does (`Get-Acl`, no profile), so the gate measures the product, not the
      # runner's cold start. The product's timeout is unchanged: a machine that slow is told so, and reads again.
      - name: Warm up Windows PowerShell
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -Command "Measure-Command { Get-Acl $env:TEMP | Out-Null } | Select-Object -ExpandProperty TotalSeconds"
      - run: npm run check

  # FD-37 (SCN-052): the app itself on Windows and Linux, driven by Playwright as the macOS suite is on a Mac:
  # nightly and on a dispatch with `e2e: true`. A Linux runner has no display, so the test runs under Xvfb.
  e2e-other:
    if: ${{ github.event_name == 'schedule' || inputs.e2e == true }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: npx install-electron
      # FD-94, as in `check`: a fresh windows-11-arm runner's first Windows PowerShell takes about a minute, and a
      # copy run from source reads the token's ACL with it before the dashboard signs in.
      - name: Warm up Windows PowerShell
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -Command "Measure-Command { Get-Acl $env:TEMP | Out-Null } | Select-Object -ExpandProperty TotalSeconds"
      - name: Drive the app (Windows)
        if: runner.os == 'Windows'
        run: node --import tsx --test test/e2e/desktop-other.test.ts
        env:
          FD_SCREENSHOTS: ${{ runner.temp }}/shots
      - name: Drive the app (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node --import tsx --test test/e2e/desktop-other.test.ts
        env:
          FD_SCREENSHOTS: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-other-${{ matrix.runner }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # FD-37: a dispatched rehearsal of the Windows and Linux packages, from any branch
  # (a workflow dispatched by name must exist on the default branch; one it calls need not).
  packages:
    needs: [check]
    permissions:
      contents: read
      id-token: write # packages.yml's Windows signing (OIDC); unused unless it signs
      actions: write # packages.yml's signing-cache step (FD-96); unused unless it signs
    if: ${{ !cancelled() && inputs.packages == true }} # a rehearsal shows the packages even when a check failed
    uses: ./.github/workflows/packages.yml
