name: validate

# Hosted checks run nightly (23:00 Europe/Warsaw) and on demand — machine CI policy
# of 2026-09-25: no full suite on every push. release.yml calls it before a release is signed.
# FD-37 / platforms.md PL-08: the nightly and a dispatch run the gate on every native runner the
# product ships for; a release keeps `os: macos` until the suite is green on all of them.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      os:
        description: 'macos, or all (macOS, Windows x64/arm64, Linux x64/arm64)'
        default: all
  workflow_call:
    inputs:
      os:
        type: string
        default: macos

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.os == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest","windows-11-arm","ubuntu-24.04","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    env:
      FD_SKIP_LAUNCHD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # The gate's UX lint and the sample service are Python; Windows runners have no `python3` by that name.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
      - name: python3 on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
      - run: npm ci
      - run: npm run check
