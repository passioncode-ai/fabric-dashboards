name: validate

# Hosted checks run nightly (23:00 Europe/Warsaw) and on demand — machine CI policy
# of 2026-09-25: no full suite on every push. release.yml calls it before a release is signed.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      FD_SKIP_LAUNCHD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
