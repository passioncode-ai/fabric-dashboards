# FD-37 M4 end-to-end proof: an older release, installed as a person installs it, updates itself to the latest
# release on every Windows and Linux runner, with nobody touching it (scripts/update-proof.mjs). Manual only: run
# it after a release, with the previous published version as `from`.
#   gh workflow run update-proof.yml -f from=0.7.4 -f to=0.7.5
name: update-proof

on:
  workflow_dispatch:
    inputs:
      from:
        description: "the installed version (an older published release)"
        required: true
      to:
        description: "the version it must update to (the latest release)"
        required: true
      os:
        description: "linux, windows, or all"
        default: all
      build:
        description: "true: the installed copy is THIS ref's code, built unsigned with the `from` version number (proves a fix before its release)"
        type: boolean
        default: false
      via:
        description: "FD-114, with build: a release between from and to; a local feed names it, then `to` once it waits ready"
        default: ""

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || inputs.os == 'windows' && '["windows-latest","windows-11-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","windows-latest","windows-11-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.via && 95 || 50 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: An AppImage needs FUSE 2 and a display
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libfuse2t64 xvfb
      - name: fpm for the arm64 .deb (a build only)
        if: inputs.build && runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get install -y -q ruby ruby-dev build-essential
          sudo gem install fpm -v 1.16.0 --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - name: Build this ref as the installed copy, numbered as the older release
        if: inputs.build
        shell: bash
        env:
          FD_PROOF_FEED: ${{ inputs.via && 'http://127.0.0.1:47391/update-feed.json' || '' }}
        run: |
          npm ci
          npm version "${{ inputs.from }}" --no-git-tag-version --workspaces-update=false --allow-same-version
          node scripts/dist-other.mjs --allow-dirty
          echo "FD_PROOF_FROM_DIR=${{ github.workspace }}/release" >> "$GITHUB_ENV"
      - name: The installed copy updates itself
        env:
          GH_TOKEN: ${{ github.token }}
          FD_PROOF_VIA: ${{ inputs.via }}
        run: node scripts/update-proof.mjs "${{ inputs.from }}" "${{ inputs.to }}"
